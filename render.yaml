services:
  - type: web
    name: dpr-matrix
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash,gemini-1.5-flash
      - key: TURSO_URL
        value: libsql://dpr-matrix-mohamedaty20.aws-eu-west-1.turso.io
      - key: TURSO_TOKEN
        sync: false
      - key: STORAGE_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MAX_FILES
        value: "10"
      - key: LOG_LEVEL
        value: INFO
